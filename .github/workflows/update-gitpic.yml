name: Update gitpic_cli formula and gitpic cask

# The file keeps its old spelling on purpose: renaming it would start a fresh
# workflow in the Actions UI and orphan this one's run history, and GitHub reads
# the cron from whatever file is on the default branch either way.

on:
  # The cron is the fallback now, not the only way in — see `repository_dispatch`
  # below. It stays six-hourly on purpose: it exists to catch what the dispatch
  # missed (an unset or expired token in gitpic, a GitHub hiccup), and polling more
  # often would only make the fallback louder without making it more correct.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  # Fired by gitpic's release workflow the moment a release is published, so the tap
  # follows within seconds instead of within six hours. Measured before this existed:
  # 0.13.0 was published at 05:17Z with the tap still pinning 0.11.5, so `brew
  # upgrade` had nothing to offer for what was already released.
  repository_dispatch:
    types: [gitpic-released]

permissions:
  contents: write

concurrency:
  group: update-gitpic-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read latest release checksums
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # Read through the environment, never interpolated into the script body:
          # this value comes off an event payload, and `${{ }}` inside `run:` would
          # splice it straight into the shell.
          #
          # Empty on a cron or a manual run, which is exactly when there is nothing to
          # cross-check against.
          WANT_VERSION: ${{ github.event.client_payload.version }}
        run: |
          tag="$(gh api repos/tarnish233/gitpic/releases/latest --jq .tag_name)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: $tag" >&2
            exit 1
          fi

          # A dispatch names the version it fired for, and it has to match what
          # `releases/latest` says. Publishing a release and `latest` moving are not
          # one atomic act, so a run that started a moment too early would read the
          # *previous* release, pin the tap to it, and look like a success — then sit
          # there until the next cron. That silent wrong answer is worth failing over;
          # the six-hourly poll is still behind us either way.
          if [[ -n "${WANT_VERSION:-}" && "$tag" != "v${WANT_VERSION}" ]]; then
            echo "dispatch was fired for v${WANT_VERSION} but releases/latest is $tag" >&2
            echo "refusing to pin the tap to a release the dispatch did not name" >&2
            exit 1
          fi

          mkdir checksums
          # Two patterns because the app zip is capitalised. Both are required: a
          # release that ships one without the other is a release this tap cannot
          # describe, and `gh release download` exits non-zero when nothing matches,
          # which is the loud failure we want over a half-updated tap.
          gh release download "$tag" --repo tarnish233/gitpic \
            --pattern "gitpic-*.tar.gz.sha256" --dir checksums
          gh release download "$tag" --repo tarnish233/gitpic \
            --pattern "GitPic-*-macos-arm64.zip.sha256" --dir checksums

          read_checksum() {
            local asset="$1"
            local checksum
            checksum="$(awk 'NR == 1 { print $1 }' "checksums/${asset}.sha256")"
            if [[ ! "$checksum" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid checksum for $asset" >&2
              exit 1
            fi
            printf '%s' "$checksum"
          }

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "arm_sha=$(read_checksum gitpic-aarch64-apple-darwin.tar.gz)" >> "$GITHUB_OUTPUT"
          echo "intel_sha=$(read_checksum gitpic-x86_64-apple-darwin.tar.gz)" >> "$GITHUB_OUTPUT"
          echo "linux_sha=$(read_checksum gitpic-x86_64-unknown-linux-gnu.tar.gz)" >> "$GITHUB_OUTPUT"
          echo "app_sha=$(read_checksum "GitPic-${tag#v}-macos-arm64.zip")" >> "$GITHUB_OUTPUT"

      - name: Update formula and cask
        env:
          GITPIC_TAG: ${{ steps.release.outputs.tag }}
          GITPIC_VERSION: ${{ steps.release.outputs.version }}
          GITPIC_ARM_SHA: ${{ steps.release.outputs.arm_sha }}
          GITPIC_INTEL_SHA: ${{ steps.release.outputs.intel_sha }}
          GITPIC_LINUX_SHA: ${{ steps.release.outputs.linux_sha }}
          GITPIC_APP_SHA: ${{ steps.release.outputs.app_sha }}
        run: |
          ruby <<'RUBY'
          path = "Formula/gitpic_cli.rb"
          formula = File.read(path)

          tag = ENV.fetch("GITPIC_TAG")
          assets = {
            "gitpic-aarch64-apple-darwin.tar.gz" => ENV.fetch("GITPIC_ARM_SHA"),
            "gitpic-x86_64-apple-darwin.tar.gz" => ENV.fetch("GITPIC_INTEL_SHA"),
            "gitpic-x86_64-unknown-linux-gnu.tar.gz" => ENV.fetch("GITPIC_LINUX_SHA"),
          }

          formula.gsub!(%r{/releases/download/v[^/]+/gitpic-}, "/releases/download/#{tag}/gitpic-")

          assets.each do |asset, checksum|
            pattern = /(url "[^"]*\/#{Regexp.escape(asset)}"\n\s+sha256 ")[0-9a-f]+(")/
            raise "asset block not found: #{asset}" unless formula.sub!(pattern) { "#{$1}#{checksum}#{$2}" }
          end

          File.write(path, formula)

          # The cask carries the version itself and interpolates it into the url, so
          # only these two lines move. Both are anchored and both raise: a silent
          # no-op here would leave the cask pointing at the previous release with the
          # previous checksum, which installs the wrong app rather than failing.
          cask_path = "Casks/gitpic.rb"
          cask = File.read(cask_path)

          version = ENV.fetch("GITPIC_VERSION")
          raise "cask version line not found" unless cask.sub!(/^(  version ")[^"]+(")$/) { "#{$1}#{version}#{$2}" }
          raise "cask sha256 line not found" unless cask.sub!(/^(  sha256 ")[0-9a-f]{64}(")$/) { "#{$1}#{ENV.fetch("GITPIC_APP_SHA")}#{$2}" }

          File.write(cask_path, cask)
          RUBY

          ruby -c Formula/gitpic_cli.rb
          ruby -c Casks/gitpic.rb

      - name: Commit update
        env:
          GITPIC_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git diff --quiet -- Formula/gitpic_cli.rb Casks/gitpic.rb; then
            echo "Formula and cask are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gitpic_cli.rb Casks/gitpic.rb
          git commit -m "chore: update gitpic_cli and gitpic to ${GITPIC_VERSION}"
          git push
