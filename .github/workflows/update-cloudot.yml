name: Update cloudot cask

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cloudot-cask
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read latest release checksum
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/tarnish233/cloudot/releases/latest --jq .tag_name)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          asset="Cloudot-${version}.dmg"
          mkdir -p checksums
          gh release download "$tag" --repo tarnish233/cloudot \
            --pattern "${asset}.sha256" --dir checksums
          sha="$(awk 'NR == 1 { print $1 }' "checksums/${asset}.sha256")"
          if [[ ! "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Invalid checksum for $asset" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Update cask
        env:
          CLOUDOT_VERSION: ${{ steps.release.outputs.version }}
          CLOUDOT_SHA: ${{ steps.release.outputs.sha }}
        run: |
          ruby <<'RUBY'
          path = "Casks/cloudot.rb"
          cask = File.read(path)
          version = ENV.fetch("CLOUDOT_VERSION")
          sha = ENV.fetch("CLOUDOT_SHA")

          raise "version field missing" unless cask.sub!(/version "[^"]+"/, "version \"#{version}\"")
          raise "sha256 field missing" unless cask.sub!(/sha256 "[0-9a-f]+"/, "sha256 \"#{sha}\"")

          File.write(path, cask)
          RUBY

      - name: Commit if changed
        env:
          CLOUDOT_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if git diff --quiet -- Casks/cloudot.rb; then
            echo "Cask already at v${CLOUDOT_VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cloudot.rb
          git commit -m "cloudot ${CLOUDOT_VERSION}"
          git push
